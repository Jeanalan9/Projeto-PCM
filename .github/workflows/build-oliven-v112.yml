name: Build Oliven v1.0.12 APK

on:
  push:
    paths:
      - 'oliven_v112/**'
      - '.github/workflows/build-oliven-v112.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        working-directory: oliven_v112
        run: gradle assembleDebug
      - name: Prepare artifact
        run: |
          mkdir -p artifact
          cp oliven_v112/app/build/outputs/apk/debug/app-debug.apk artifact/Oliven-v1.0.12.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Oliven-APK-v1.0.12
          path: artifact/Oliven-v1.0.12.apk
