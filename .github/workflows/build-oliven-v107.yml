name: Build Oliven v1.0.7 APK
on:
  push:
    branches: [oliven-habitos-apk-build]
    paths:
      - 'oliven_v107/**'
      - '.github/workflows/build-oliven-v107.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: oliven_v107
        run: gradle assembleDebug --no-daemon
      - name: Prepare artifact
        run: cp oliven_v107/app/build/outputs/apk/debug/app-debug.apk Oliven-v1.0.7.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Oliven-APK-v1.0.7
          path: Oliven-v1.0.7.apk
