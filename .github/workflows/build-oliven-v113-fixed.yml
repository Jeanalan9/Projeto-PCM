name: Build Oliven v1.0.13 APK Fixed

on:
  push:
    branches: [ oliven-habitos-apk-build ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare Oliven v1.0.13 sources
        run: |
          rm -rf oliven_v113
          mkdir -p oliven_v113/app/src/main/java/com/oliven/app
          mkdir -p oliven_v113/app/src/main/res/drawable oliven_v113/app/src/main/res/values
          python - <<'PY'
          from pathlib import Path
          import base64, zlib
          chunks = [
          '',
          '',
          '',
          '',
          '',
          '',
          '',
          '',
          '',
          '',
          '',
          '1yKZ1d03XxyPnp5ugz1Jly0yTKXefZYkI16N3F8s3Jj9BYHK2Znm/1yT+NM11x/9H+ETE9E=',
          ]
          java = zlib.decompress(base64.b64decode(''.join(chunks))).decode('utf-8')
          files = {
          'oliven_v113/build.gradle': '''plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          ''',
          'oliven_v113/settings.gradle': '''pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = 'Oliven113'
          include ':app'
          ''',
          'oliven_v113/app/build.gradle': '''plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.oliven.app'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.oliven.app'
                  minSdk 23
                  targetSdk 34
                  versionCode 13
                  versionName '1.0.13'
              }
          }
          ''',
          'oliven_v113/app/src/main/AndroidManifest.xml': '''<manifest xmlns:android='http://schemas.android.com/apk/res/android'>
              <application
                  android:theme='@style/AppTheme'
                  android:label='Oliven'
                  android:icon='@drawable/oliven_logo_icon'
                  android:roundIcon='@drawable/oliven_logo_icon'
                  android:allowBackup='false'
                  android:supportsRtl='true'>
                  <activity
                      android:name='.MainActivity'
                      android:screenOrientation='portrait'
                      android:exported='true'>
                      <intent-filter>
                          <action android:name='android.intent.action.MAIN' />
                          <category android:name='android.intent.category.LAUNCHER' />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          ''',
          'oliven_v113/app/src/main/res/values/styles.xml': '''<resources>
              <style name='AppTheme' parent='android:style/Theme.Material.Light.NoActionBar'>
                  <item name='android:fontFamily'>sans</item>
                  <item name='android:windowNoTitle'>true</item>
                  <item name='android:windowActionBar'>false</item>
                  <item name='android:windowLightStatusBar'>true</item>
                  <item name='android:statusBarColor'>#FAFBF8</item>
                  <item name='android:navigationBarColor'>#000000</item>
                  <item name='android:windowBackground'>#FAFBF8</item>
              </style>
          </resources>
          ''',
          'oliven_v113/app/src/main/res/drawable/oliven_logo_icon.xml': '''<vector xmlns:android='http://schemas.android.com/apk/res/android' android:width='108dp' android:height='108dp' android:viewportWidth='108' android:viewportHeight='108'>
              <path android:pathData='M20,54 L37,54' android:strokeColor='#748A35' android:strokeWidth='7' android:strokeLineCap='round' android:fillColor='@android:color/transparent'/>
              <path android:pathData='M71,54 L88,54' android:strokeColor='#748A35' android:strokeWidth='7' android:strokeLineCap='round' android:fillColor='@android:color/transparent'/>
              <path android:pathData='M18,48 A36,36 0,0 1,90 48' android:strokeColor='#748A35' android:strokeWidth='8' android:strokeLineCap='butt' android:fillColor='@android:color/transparent'/>
              <path android:pathData='M18,60 A36,36 0,0 0,90 60' android:strokeColor='#748A35' android:strokeWidth='8' android:strokeLineCap='butt' android:fillColor='@android:color/transparent'/>
              <path android:fillColor='#748A35' android:pathData='M20,54m-5,0a5,5 0,1 0,10 0a5,5 0,1 0,-10 0'/>
              <path android:fillColor='#748A35' android:pathData='M37,54m-6,0a6,6 0,1 0,12 0a6,6 0,1 0,-12 0'/>
              <path android:fillColor='#748A35' android:pathData='M71,54m-6,0a6,6 0,1 0,12 0a6,6 0,1 0,-12 0'/>
              <path android:fillColor='#748A35' android:pathData='M88,54m-5,0a5,5 0,1 0,10 0a5,5 0,1 0,-10 0'/>
          </vector>
          ''',
          'oliven_v113/app/src/main/java/com/oliven/app/MainActivity.java': java,
          }
          for path, content in files.items():
              Path(path).parent.mkdir(parents=True, exist_ok=True)
              Path(path).write_text(content.strip() + '\n', encoding='utf-8')
          PY
      - name: Build APK
        run: |
          cd oliven_v113
          gradle :app:assembleDebug --no-daemon
      - name: Prepare artifact
        run: |
          mkdir -p artifact
          cp oliven_v113/app/build/outputs/apk/debug/app-debug.apk artifact/Oliven-v1.0.13.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Oliven-APK-v1.0.13
          path: artifact/Oliven-v1.0.13.apk
