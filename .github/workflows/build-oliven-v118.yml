name: Build Oliven v1.0.18 APK

on:
  push:
    branches: [ oliven-habitos-apk-build ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare Oliven v1.0.18 sources
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, zlib, hashlib

          src = Path('.github/workflows/build-oliven-v114.yml').read_text(encoding='utf-8')
          start = src.index('          from pathlib import Path')
          end = src.index('\n          PY', start)
          bloco = src[start:end]
          codigo = '\n'.join(linha[10:] if linha.startswith('          ') else linha for linha in bloco.splitlines())
          exec(compile(codigo, 'build-oliven-v114-extraido.py', 'exec'), {})

          parts = [p.read_text(encoding='utf-8').strip() for p in sorted(Path('oliven_build/v117').glob('main.zb64.*'))]
          java = zlib.decompress(base64.b64decode(''.join(parts))).decode('utf-8')
          original_sha = hashlib.sha256(java.encode('utf-8')).hexdigest()
          if original_sha != '03ce7a807469af156167d76ce0b4e1bee5582adaa64c8c74fd9aef977ecd3c58':
              raise SystemExit(f'SHA inesperado do MainActivity v1.0.17: {original_sha}')

          java = java.replace('Oliven 1.0.17 · Android nativo', 'Oliven 1.0.18 · Android nativo')

          old_month = '''        int monthPct(Calendar base){
            Calendar m=(Calendar)base.clone(); m.set(Calendar.DAY_OF_MONTH,1); int max=m.getActualMaximum(Calendar.DAY_OF_MONTH); int sum=0,count=0;
            for(int d=1; d<=max; d++){ Calendar c=cal(m.get(Calendar.YEAR),m.get(Calendar.MONTH),d); if(c.after(now)) break; if(hasData(c)){ sum+=pct(c); count++; } }
            return count==0 ? -1 : Math.round(sum/(float)count);
        }'''
          new_month = '''        int monthPct(Calendar base){
            Calendar m=(Calendar)base.clone();
            m.set(Calendar.DAY_OF_MONTH,1);
            int max=m.getActualMaximum(Calendar.DAY_OF_MONTH);
            int sum=0, count=0;
            for(int d=1; d<=max; d++){
                Calendar c=cal(m.get(Calendar.YEAR),m.get(Calendar.MONTH),d);
                if(c.after(now)) break;
                boolean diaRegistrado=prefs.getBoolean(touched(c),false);
                for(int i=0;i<mainCount();i++) if(done(c,i)) { diaRegistrado=true; break; }
                if(diaRegistrado){
                    sum += pct(c);
                    count++;
                }
            }
            return count==0 ? -1 : Math.round(sum/(float)count);
        }'''
          if old_month not in java:
              raise SystemExit('Bloco monthPct não encontrado para atualização')
          java = java.replace(old_month, new_month)

          java = java.replace('for(int i=0;i<7;i++) center(c,ds[i],l+cell*i+cell/2,t,8.0f,MUTED,false);',
                              'for(int i=0;i<7;i++) center(c,ds[i],l+cell*i+cell/2,t,9.0f,MUTED,false);')
          java = java.replace('float sq=Math.min(18, Math.max(14, rowH-7));',
                              'float sq=Math.min(21, Math.max(15, rowH-6));')
          java = java.replace('center(c,String.valueOf(d),cx,cy+4,8.3f,selected?GREEN_DARK:TEXT,selected || pc>=80);',
                              'center(c,String.valueOf(d),cx,cy+4.8f,9.8f,selected?GREEN_DARK:TEXT,selected || pc>=80);')
          java = java.replace('center(c,v<0?"-":v+"%",cx,cy+4,7.8f,TEXT,true);',
                              'center(c,v<0?"-":v+"%",cx,cy+4.5f,8.4f,TEXT,true);')

          sha = hashlib.sha256(java.encode('utf-8')).hexdigest()
          if sha != 'c3e6cb42072871b59c13d139c5ef3bffcf91576263d254983093f17644675e00':
              raise SystemExit(f'SHA inesperado do MainActivity v1.0.18: {sha}')
          Path('oliven_v114/app/src/main/java/com/oliven/app/MainActivity.java').write_text(java, encoding='utf-8')

          logo = '''<vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:pathData="M20,54 L37,54" android:strokeColor="#748A35" android:strokeWidth="7" android:strokeLineCap="round" android:fillColor="@android:color/transparent"/>
              <path android:pathData="M71,54 L88,54" android:strokeColor="#748A35" android:strokeWidth="7" android:strokeLineCap="round" android:fillColor="@android:color/transparent"/>
              <path android:pathData="M18,48 A36,36 0,0 1,90 48" android:strokeColor="#748A35" android:strokeWidth="8" android:strokeLineCap="butt" android:fillColor="@android:color/transparent"/>
              <path android:pathData="M18,60 A36,36 0,0 0,90 60" android:strokeColor="#748A35" android:strokeWidth="8" android:strokeLineCap="butt" android:fillColor="@android:color/transparent"/>
              <path android:fillColor="#748A35" android:pathData="M20,54m-5,0a5,5 0,1 0,10 0a5,5 0,1 0,-10 0"/>
              <path android:fillColor="#748A35" android:pathData="M37,54m-6,0a6,6 0,1 0,12 0a6,6 0,1 0,-12 0"/>
              <path android:fillColor="#748A35" android:pathData="M71,54m-6,0a6,6 0,1 0,12 0a6,6 0,1 0,-12 0"/>
              <path android:fillColor="#748A35" android:pathData="M88,54m-5,0a5,5 0,1 0,10 0a5,5 0,1 0,-10 0"/>
          </vector>
          '''
          Path('oliven_v114/app/src/main/res/drawable/oliven_logo_icon.xml').write_text(logo, encoding='utf-8')

          gradle = Path('oliven_v114/app/build.gradle')
          g = gradle.read_text(encoding='utf-8')
          g = g.replace('versionCode 14', 'versionCode 18').replace("versionName '1.0.14'", "versionName '1.0.18'")
          gradle.write_text(g, encoding='utf-8')
          settings = Path('oliven_v114/settings.gradle')
          settings.write_text(settings.read_text(encoding='utf-8').replace('Oliven114','Oliven118'), encoding='utf-8')
          PY
      - name: Build APK
        run: |
          cd oliven_v114
          gradle :app:assembleDebug --no-daemon
      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp oliven_v114/app/build/outputs/apk/debug/app-debug.apk dist/Oliven-v1.0.18.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Oliven-APK-v1.0.18
          path: dist/Oliven-v1.0.18.apk
