name: Build Oliven v1.0.10 APK

on:
  push:
    branches: [ oliven-habitos-apk-build ]
    paths:
      - 'oliven_v110/**'
      - '.github/workflows/build-oliven-v110.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        working-directory: oliven_v110
        run: gradle :app:assembleDebug --no-daemon
      - name: Prepare artifact
        run: |
          mkdir -p artifact
          cp oliven_v110/app/build/outputs/apk/debug/app-debug.apk artifact/Oliven-v1.0.10.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Oliven-APK-v1.0.10
          path: artifact/Oliven-v1.0.10.apk
