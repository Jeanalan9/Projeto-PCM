name: Build Oliven v1.0.14 APK Final D

on:
  push:
    branches: [ oliven-habitos-apk-build ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare Oliven v1.0.14 sources
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          src = Path('.github/workflows/build-oliven-v114.yml').read_text(encoding='utf-8')
          start = src.index('          from pathlib import Path')
          end = src.index('\n          PY', start)
          bloco = src[start:end]
          codigo = '\n'.join(linha[10:] if linha.startswith('          ') else linha for linha in bloco.splitlines())
          exec(compile(codigo, 'build-oliven-v114-extraido.py', 'exec'), {})

          main = Path('oliven_v114/app/src/main/java/com/oliven/app/MainActivity.java')
          java = main.read_text(encoding='utf-8')
          java = re.sub(r'\n\s*boolean sameDay\(Calendar a, Calendar b\)\{[^\n]*?\}', '', java)
          metodo = '\n        boolean sameDay(Calendar a, Calendar b){ return a.get(Calendar.YEAR)==b.get(Calendar.YEAR) && a.get(Calendar.MONTH)==b.get(Calendar.MONTH) && a.get(Calendar.DAY_OF_MONTH)==b.get(Calendar.DAY_OF_MONTH); }'
          if '\n        boolean future(Calendar c){' in java:
              java = java.replace('\n        boolean future(Calendar c){', metodo + '\n        boolean future(Calendar c){', 1)
          else:
              java = java.replace('\n        String shortMonth(Calendar c){', metodo + '\n        String shortMonth(Calendar c){', 1)
          main.write_text(java, encoding='utf-8')
          PY
      - name: Build APK
        run: |
          cd oliven_v114
          gradle :app:assembleDebug --no-daemon
      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp oliven_v114/app/build/outputs/apk/debug/app-debug.apk dist/Oliven-v1.0.14.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Oliven-APK-v1.0.14
          path: dist/Oliven-v1.0.14.apk
