name: Build Controle Fiscal V0.4.9

on:
  push:
    branches:
      - controle-fiscal-v049-build
    paths:
      - '.github/workflows/build-controle-fiscal-v049.yml'
      - '.build-v049/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reconstruct Android project
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p android-v049
          cat .build-v049/payload.part* > /tmp/controle-fiscal-v049-project.tar.gz.b64
          test "$(wc -c < /tmp/controle-fiscal-v049-project.tar.gz.b64)" = "77656"
          echo "20941d34df4ff760b87fcfec2ca136f656de0ab22bea606cf0b58909e38203f9  /tmp/controle-fiscal-v049-project.tar.gz.b64" | sha256sum -c -
          base64 -d /tmp/controle-fiscal-v049-project.tar.gz.b64 > /tmp/controle-fiscal-v049-project.tar.gz
          echo "4a9c68e61c499bbd02170d0e4cafcb801fda49707ce017a7910911a9cbb9ec5e  /tmp/controle-fiscal-v049-project.tar.gz" | sha256sum -c -
          tar -xzf /tmp/controle-fiscal-v049-project.tar.gz -C android-v049
          test -f android-v049/settings.gradle
          test -f android-v049/app/build.gradle

      - name: Install Android 35
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        id: build_apk
        continue-on-error: true
        working-directory: android-v049
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug 2>&1 | tee ../build-v049.log

      - name: Validate APK
        id: validate_apk
        if: steps.build_apk.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euxo pipefail
          APK="android-v049/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee validate-v049.log
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee badging-v049.txt
          grep -F "package: name='br.com.jeanalan9.controlefiscalpcm.testev049' versionCode='49' versionName='0.4.9'" badging-v049.txt

      - name: Publish build result to branch
        if: always()
        shell: bash
        env:
          BUILD_OUTCOME: ${{ steps.build_apk.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate_apk.outcome }}
        run: |
          set -euxo pipefail
          rm -rf dist-v049
          mkdir -p dist-v049
          printf 'build=%s\nvalidate=%s\ncommit=%s\n' "$BUILD_OUTCOME" "$VALIDATE_OUTCOME" "$GITHUB_SHA" > dist-v049/STATUS.txt
          test -f build-v049.log && cp build-v049.log dist-v049/build-v049.log || true
          test -f validate-v049.log && cp validate-v049.log dist-v049/validate-v049.log || true
          test -f badging-v049.txt && cp badging-v049.txt dist-v049/badging-v049.txt || true
          APK="android-v049/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK" ]; then
            cp "$APK" dist-v049/Controle_Fiscal_PCM_V0.4.9_TESTE_LATERAL.apk
            sha256sum dist-v049/Controle_Fiscal_PCM_V0.4.9_TESTE_LATERAL.apk > dist-v049/SHA256SUMS.txt
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f dist-v049
          git commit -m 'build: publish Controle Fiscal V0.4.9 result [skip build]' || true
          git push

      - name: Upload APK artifact
        if: steps.build_apk.outcome == 'success' && steps.validate_apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Controle_Fiscal_PCM_V0.4.9_TESTE_LATERAL
          path: dist-v049/*
          if-no-files-found: error
          retention-days: 7

      - name: Enforce successful build and validation
        if: steps.build_apk.outcome != 'success' || steps.validate_apk.outcome != 'success'
        shell: bash
        run: exit 1
