name: Build Controle Fiscal V0.4.9

on:
  push:
    branches:
      - controle-fiscal-v049-build
    paths:
      - '.github/workflows/build-controle-fiscal-v049.yml'
      - '.build-v049/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reconstruct Android project
        id: reconstruct
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            set -x
            rm -rf android-v049
            mkdir -p android-v049
            cat .build-v049/payload.part* > /tmp/controle-fiscal-v049-project.tar.gz.b64
            wc -c /tmp/controle-fiscal-v049-project.tar.gz.b64
            sha256sum /tmp/controle-fiscal-v049-project.tar.gz.b64
            base64 -d /tmp/controle-fiscal-v049-project.tar.gz.b64 > /tmp/controle-fiscal-v049-project.tar.gz
            sha256sum /tmp/controle-fiscal-v049-project.tar.gz
            tar -tzf /tmp/controle-fiscal-v049-project.tar.gz | head -30
            tar -xzf /tmp/controle-fiscal-v049-project.tar.gz -C android-v049
            test -f android-v049/settings.gradle
            test -f android-v049/app/build.gradle
          } 2>&1 | tee reconstruct-v049.log

      - name: Install Android 35
        id: android_sdk
        if: steps.reconstruct.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            set -x
            yes | sdkmanager --licenses >/dev/null || true
            sdkmanager "platforms;android-35" "build-tools;35.0.0"
          } 2>&1 | tee android-sdk-v049.log

      - name: Build debug APK
        id: build_apk
        if: steps.reconstruct.outcome == 'success' && steps.android_sdk.outcome == 'success'
        continue-on-error: true
        working-directory: android-v049
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug 2>&1 | tee ../build-v049.log

      - name: Validate APK
        id: validate_apk
        if: steps.build_apk.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            set -x
            APK="android-v049/app/build/outputs/apk/debug/app-debug.apk"
            test -f "$APK"
            "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee badging-v049.txt
            grep -F "package: name='br.com.jeanalan9.controlefiscalpcm.testev049' versionCode='49' versionName='0.4.9'" badging-v049.txt
          } 2>&1 | tee validate-v049.log

      - name: Publish build result to branch
        if: always()
        shell: bash
        env:
          RECONSTRUCT_OUTCOME: ${{ steps.reconstruct.outcome }}
          SDK_OUTCOME: ${{ steps.android_sdk.outcome }}
          BUILD_OUTCOME: ${{ steps.build_apk.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate_apk.outcome }}
        run: |
          set -euxo pipefail
          rm -rf dist-v049
          mkdir -p dist-v049
          printf 'reconstruct=%s\nsdk=%s\nbuild=%s\nvalidate=%s\ncommit=%s\n' "$RECONSTRUCT_OUTCOME" "$SDK_OUTCOME" "$BUILD_OUTCOME" "$VALIDATE_OUTCOME" "$GITHUB_SHA" > dist-v049/STATUS.txt
          for f in reconstruct-v049.log android-sdk-v049.log build-v049.log validate-v049.log badging-v049.txt; do
            test -f "$f" && cp "$f" dist-v049/ || true
          done
          APK="android-v049/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK" ]; then
            cp "$APK" dist-v049/Controle_Fiscal_PCM_V0.4.9_TESTE_LATERAL.apk
            sha256sum dist-v049/Controle_Fiscal_PCM_V0.4.9_TESTE_LATERAL.apk > dist-v049/SHA256SUMS.txt
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f dist-v049
          git commit -m 'build: publish Controle Fiscal V0.4.9 result [skip build]' || true
          git push

      - name: Upload APK artifact
        if: steps.build_apk.outcome == 'success' && steps.validate_apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Controle_Fiscal_PCM_V0.4.9_TESTE_LATERAL
          path: dist-v049/*
          if-no-files-found: error
          retention-days: 7

      - name: Enforce successful build and validation
        if: steps.reconstruct.outcome != 'success' || steps.android_sdk.outcome != 'success' || steps.build_apk.outcome != 'success' || steps.validate_apk.outcome != 'success'
        shell: bash
        run: exit 1
