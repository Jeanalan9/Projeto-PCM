name: Build Oliven APK
on:
  push:
    branches: [ oliven-habitos-apk-build ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare Oliven source
        run: |
          mkdir -p build_oliven
          base64 -d oliven_build/oliven_project.tar.gz.b64 | tar -xz -C build_oliven
      - name: Build APK
        run: gradle -p build_oliven :app:assembleDebug --stacktrace
      - name: Prepare artifact
        run: cp build_oliven/app/build/outputs/apk/debug/app-debug.apk Oliven-v1.0.1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Oliven-APK-v1.0.1
          path: Oliven-v1.0.1.apk
          if-no-files-found: error
