name: Build Oliven v1.0.15 APK Final

on:
  push:
    branches: [ oliven-habitos-apk-build ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare Oliven v1.0.15 sources
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, zlib, hashlib, re
          src = Path('.github/workflows/build-oliven-v114.yml').read_text(encoding='utf-8')
          start = src.index('          from pathlib import Path')
          end = src.index('\n          PY', start)
          bloco = src[start:end]
          codigo = '\n'.join(linha[10:] if linha.startswith('          ') else linha for linha in bloco.splitlines())
          exec(compile(codigo, 'build-oliven-v114-extraido.py', 'exec'), {})
          parts = []
          for n in range(1,5):
              parts.append(Path(f'oliven_build/v115/main.zb64.{n:03d}').read_text(encoding='utf-8').strip())
          b64 = ''.join(parts)
          java = zlib.decompress(base64.b64decode(b64)).decode('utf-8')
          sha = hashlib.sha256(java.encode('utf-8')).hexdigest()
          if sha != '6581eafddfda3474e71d24f0a972347f3fe5544eef1b38734acb72e7b54a66b4':
              raise SystemExit(f'SHA inesperado do MainActivity.java: {sha}')
          Path('oliven_v114/app/src/main/java/com/oliven/app/MainActivity.java').write_text(java, encoding='utf-8')
          logo = '''<vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#FFFFFF" android:pathData="M0,0h108v108h-108z"/>
              <path android:pathData="M24,54 L41,54" android:strokeColor="#748A35" android:strokeWidth="6.2" android:strokeLineCap="round" android:fillColor="@android:color/transparent"/>
              <path android:pathData="M67,54 L84,54" android:strokeColor="#748A35" android:strokeWidth="6.2" android:strokeLineCap="round" android:fillColor="@android:color/transparent"/>
              <path android:pathData="M22,48 A32,32 0,0 1,86 48" android:strokeColor="#748A35" android:strokeWidth="7.2" android:strokeLineCap="butt" android:fillColor="@android:color/transparent"/>
              <path android:pathData="M22,60 A32,32 0,0 0,86 60" android:strokeColor="#748A35" android:strokeWidth="7.2" android:strokeLineCap="butt" android:fillColor="@android:color/transparent"/>
              <path android:fillColor="#748A35" android:pathData="M24,54m-4.6,0a4.6,4.6 0,1 0,9.2 0a4.6,4.6 0,1 0,-9.2 0"/>
              <path android:fillColor="#748A35" android:pathData="M41,54m-5.4,0a5.4,5.4 0,1 0,10.8 0a5.4,5.4 0,1 0,-10.8 0"/>
              <path android:fillColor="#748A35" android:pathData="M67,54m-5.4,0a5.4,5.4 0,1 0,10.8 0a5.4,5.4 0,1 0,-10.8 0"/>
              <path android:fillColor="#748A35" android:pathData="M84,54m-4.6,0a4.6,4.6 0,1 0,9.2 0a4.6,4.6 0,1 0,-9.2 0"/>
          </vector>
          '''
          Path('oliven_v114/app/src/main/res/drawable/oliven_logo_icon.xml').write_text(logo, encoding='utf-8')
          gradle = Path('oliven_v114/app/build.gradle')
          g = gradle.read_text(encoding='utf-8')
          g = g.replace('versionCode 14', 'versionCode 15').replace("versionName '1.0.14'", "versionName '1.0.15'")
          gradle.write_text(g, encoding='utf-8')
          settings = Path('oliven_v114/settings.gradle')
          settings.write_text(settings.read_text(encoding='utf-8').replace('Oliven114','Oliven115'), encoding='utf-8')
          PY
      - name: Build APK
        run: |
          cd oliven_v114
          gradle :app:assembleDebug --no-daemon
      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp oliven_v114/app/build/outputs/apk/debug/app-debug.apk dist/Oliven-v1.0.15.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Oliven-APK-v1.0.15
          path: dist/Oliven-v1.0.15.apk
