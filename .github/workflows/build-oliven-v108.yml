name: Build Oliven v1.0.8 APK

on:
  push:
    branches: [ oliven-habitos-apk-build ]
    paths:
      - 'oliven_v108/**'
      - '.github/workflows/build-oliven-v108.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: oliven_v108
        run: gradle assembleDebug
      - name: Prepare artifact
        run: cp oliven_v108/app/build/outputs/apk/debug/app-debug.apk Oliven-v1.0.8.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Oliven-APK-v1.0.8
          path: Oliven-v1.0.8.apk
