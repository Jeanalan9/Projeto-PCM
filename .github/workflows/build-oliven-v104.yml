name: Build Oliven v1.0.4 APK
on:
  push:
    branches: [ oliven-habitos-apk-build ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle -p oliven_v104 :app:assembleDebug --stacktrace
      - name: Prepare artifact
        run: cp oliven_v104/app/build/outputs/apk/debug/app-debug.apk Oliven-v1.0.4.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Oliven-APK-v1.0.4
          path: Oliven-v1.0.4.apk
          if-no-files-found: error
