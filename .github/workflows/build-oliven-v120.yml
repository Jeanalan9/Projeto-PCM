name: Build Oliven v1.0.20 APK

on:
  push:
    branches: [ oliven-habitos-apk-build ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare Oliven v1.0.20 sources
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib

          def executar_python_workflow(path):
              src = Path(path).read_text(encoding='utf-8')
              start = src.index('          from pathlib import Path')
              end = src.index('\n          PY', start)
              bloco = src[start:end]
              codigo = '\n'.join(linha[10:] if linha.startswith('          ') else linha for linha in bloco.splitlines())
              exec(compile(codigo, path + '-extraido.py', 'exec'), {})

          def replace_method(src, name, new_body):
              needle = 'void ' + name + '('
              start = src.index(needle)
              brace = src.index('{', start)
              depth = 0
              end = None
              for i in range(brace, len(src)):
                  ch = src[i]
                  if ch == '{':
                      depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break
              if end is None:
                  raise SystemExit('Não encontrei o fim do método ' + name)
              return src[:start] + new_body + src[end:]

          executar_python_workflow('.github/workflows/build-oliven-v119-fixed.yml')

          main = Path('oliven_v114/app/src/main/java/com/oliven/app/MainActivity.java')
          java = main.read_text(encoding='utf-8')
          java = java.replace('Oliven 1.0.19 · Android nativo', 'Oliven 1.0.20 · Android nativo')

          draw_month_ring = r'''void drawMonthRing(Canvas c,float cx,float cy,float r,Calendar month){
                      Calendar m=(Calendar)month.clone();
                      m.set(Calendar.DAY_OF_MONTH,1);
                      int max=m.getActualMaximum(Calendar.DAY_OF_MONTH);
                      for(int d=1;d<=max;d++){
                          float step=360f/max;
                          float angDeg=-90+(d-1)*step;
                          double ang=Math.toRadians(angDeg);
                          float sx=cx+(float)Math.cos(ang)*r;
                          float sy=cy+(float)Math.sin(ang)*r;
                          Calendar day=cal(m.get(Calendar.YEAR),m.get(Calendar.MONTH),d);
                          int pc=pct(day);
                          boolean sel=sameDay(day,selectedDay);

                          float w=17.0f;
                          float h=38.0f;
                          float radius=6.6f;
                          int save=c.save();
                          c.rotate(angDeg+90,X(sx),Y(sy));
                          round(c,sx-w/2,sy-h/2,sx+w/2,sy+h/2,radius,LIGHT);
                          if(!future(day) && pc>0){
                              float pad=1.5f;
                              float fillH=(h-pad*2)*pc/100f;
                              round(c,sx-w/2+pad,sy+h/2-pad-fillH,sx+w/2-pad,sy+h/2-pad,5.5f,GREEN);
                          }
                          if(sel){
                              p.setStyle(Paint.Style.STROKE);
                              p.setStrokeWidth(X(1.9f));
                              p.setColor(GREEN_DARK);
                              c.drawRoundRect(X(sx-w/2-1.8f),Y(sy-h/2-1.8f),X(sx+w/2+1.8f),Y(sy+h/2+1.8f),X(7.2f),X(7.2f),p);
                              p.setStyle(Paint.Style.FILL);
                          }
                          c.restoreToCount(save);

                          float lx=cx+(float)Math.cos(ang)*(r+35);
                          float ly=cy+(float)Math.sin(ang)*(r+35);
                          center(c,String.valueOf(d),lx,ly+3,6.3f,sel?GREEN_DARK:MUTED,sel);
                          hit(sx-19,sy-24,sx+19,sy+24,11,d);
                      }
                      p.setStyle(Paint.Style.FILL);
                      p.setColor(WHITE);
                      c.drawCircle(X(cx),Y(cy),X(61),p);
                      center(c,String.valueOf(selectedDay.get(Calendar.DAY_OF_MONTH)),cx,cy-8,35,TEXT,true);
                      center(c,shortMonth(selectedDay),cx,cy+22,9.8f,MUTED,true);
                      center(c,pct(selectedDay)+"%",cx,cy+42,9.5f,GREEN,true);
                  }'''

          java = replace_method(java, 'drawMonthRing', draw_month_ring)
          main.write_text(java, encoding='utf-8')

          gradle = Path('oliven_v114/app/build.gradle')
          g = gradle.read_text(encoding='utf-8')
          for old_code in ['versionCode 19', 'versionCode 18', 'versionCode 14']:
              g = g.replace(old_code, 'versionCode 20')
          for old_name in ["versionName '1.0.19'", "versionName '1.0.18'", "versionName '1.0.14'"]:
              g = g.replace(old_name, "versionName '1.0.20'")
          gradle.write_text(g, encoding='utf-8')

          settings = Path('oliven_v114/settings.gradle')
          settings.write_text(settings.read_text(encoding='utf-8').replace('Oliven119','Oliven120').replace('Oliven118','Oliven120').replace('Oliven114','Oliven120'), encoding='utf-8')

          print('MainActivity v1.0.20 SHA:', hashlib.sha256(java.encode('utf-8')).hexdigest())
          PY
      - name: Build APK
        run: |
          cd oliven_v114
          gradle :app:assembleDebug --no-daemon
      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp oliven_v114/app/build/outputs/apk/debug/app-debug.apk dist/Oliven-v1.0.20.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Oliven-APK-v1.0.20
          path: dist/Oliven-v1.0.20.apk
