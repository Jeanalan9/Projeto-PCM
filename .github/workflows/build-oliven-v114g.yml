name: Build Oliven v1.0.14 APK Final G

on:
  push:
    branches: [ oliven-habitos-apk-build ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare Oliven v1.0.14 sources
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/build-oliven-v114.yml').read_text(encoding='utf-8')
          start = src.index('          from pathlib import Path')
          end = src.index('\n          PY', start)
          bloco = src[start:end]
          codigo = '\n'.join(linha[10:] if linha.startswith('          ') else linha for linha in bloco.splitlines())
          exec(compile(codigo, 'build-oliven-v114-extraido.py', 'exec'), {})

          main = Path('oliven_v114/app/src/main/java/com/oliven/app/MainActivity.java')
          linhas = main.read_text(encoding='utf-8').splitlines()
          # Remove apenas métodos one-line sameDay adicionados em excesso. Mantém qualquer implementação existente do arquivo-base.
          filtradas = []
          removidos = 0
          for ln in linhas:
              if 'boolean sameDay' in ln and 'return' in ln and 'DAY_OF_MONTH' in ln:
                  removidos += 1
                  continue
              filtradas.append(ln)
          main.write_text('\n'.join(filtradas) + '\n', encoding='utf-8')
          print('sameDay one-line removidos:', removidos)
          PY
      - name: Build APK
        run: |
          cd oliven_v114
          grep -n "sameDay" app/src/main/java/com/oliven/app/MainActivity.java || true
          gradle :app:assembleDebug --no-daemon
      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp oliven_v114/app/build/outputs/apk/debug/app-debug.apk dist/Oliven-v1.0.14.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Oliven-APK-v1.0.14
          path: dist/Oliven-v1.0.14.apk
